<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SocialHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            font-size: 38px;
            font-weight: 800;
            color: #4f46e5;
            letter-spacing: -1px;
        }

        .logo p {
            margin-top: 7px;
            color: #64748b;
            font-size: 15px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(15, 23, 42, 0.12);
            border: 1px solid #e2e8f0;
        }

        .tabs {
            display: flex;
            background: #f1f5f9;
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .tab {
            width: 50%;
            padding: 11px;
            border: none;
            background: transparent;
            border-radius: 9px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #64748b;
        }

        .tab.active {
            background: white;
            color: #4f46e5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-title {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .form-subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 22px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
            background: white;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
        }

        .main-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.2s;
        }

        .main-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(79,70,229,0.25);
        }

        .main-btn:active {
            transform: scale(0.98);
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

        .demo {
            text-align: center;
            margin-top: 22px;
            color: #94a3b8;
            font-size: 12px;
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: #94a3b8;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 23px;
                border-radius: 17px;
            }

            .logo h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            <h1>SocialHub</h1>
            <p>Simple • Clean • Upgradeable</p>
        </div>

        <div class="card">

            <div class="tabs">
                <button class="tab active" onclick="showLogin()">
                    Login
                </button>

                <button class="tab" onclick="showRegister()">
                    Register
                </button>
            </div>

            <!-- LOGIN -->
            <div id="loginForm">

                <h2 class="form-title">Welcome back</h2>

                <p class="form-subtitle">
                    Login to continue to SocialHub.
                </p>

                <div class="input-group">
                    <label>Username</label>
                    <input
                        type="text"
                        id="loginUsername"
                        placeholder="Enter username"
                    >
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter password"
                    >
                </div>

                <button class="main-btn" onclick="login()">
                    Login
                </button>

                <div class="message" id="loginMessage"></div>

            </div>


            <!-- REGISTER -->
            <div id="registerForm" style="display:none;">

                <h2 class="form-title">Create account</h2>

                <p class="form-subtitle">
                    Join SocialHub today.
                </p>

                <div class="input-group">
                    <label>Username</label>
                    <input
                        type="text"
                        id="registerUsername"
                        placeholder="Choose username"
                    >
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create password"
                    >
                </div>

                <button class="main-btn" onclick="register()">
                    Create Account
                </button>

                <div class="message" id="registerMessage"></div>

            </div>

            <div class="demo">
                Demo mode • Data saved in your browser
            </div>

        </div>

        <div class="footer">
            © 2026 SocialHub
        </div>

    </div>


    <script>

        function showLogin() {

            document.getElementById("loginForm").style.display = "block";
            document.getElementById("registerForm").style.display = "none";

            document.querySelectorAll(".tab")[0].classList.add("active");
            document.querySelectorAll(".tab")[1].classList.remove("active");
        }


        function showRegister() {

            document.getElementById("loginForm").style.display = "none";
            document.getElementById("registerForm").style.display = "block";

            document.querySelectorAll(".tab")[0].classList.remove("active");
            document.querySelectorAll(".tab")[1].classList.add("active");
        }


        function register() {

            const username =
                document.getElementById("registerUsername").value.trim();

            const password =
                document.getElementById("registerPassword").value;

            const message =
                document.getElementById("registerMessage");


            if (!username || !password) {

                message.style.color = "#ef4444";
                message.textContent = "Please fill all fields.";
                return;
            }


            localStorage.setItem(
                "socialhub_user",
                JSON.stringify({
                    username: username,
                    password: password
                })
            );


            message.style.color = "#16a34a";
            message.textContent = "Account created successfully!";


            setTimeout(() => {
                showLogin();

                document.getElementById("loginUsername").value = username;
            }, 800);
        }


        function login() {

            const username =
                document.getElementById("loginUsername").value.trim();

            const password =
                document.getElementById("loginPassword").value;

            const message =
                document.getElementById("loginMessage");


            const savedUser =
                JSON.parse(localStorage.getItem("socialhub_user"));


            if (!savedUser) {

                message.style.color = "#ef4444";
                message.textContent =
                    "No account found. Please register first.";

                return;
            }


            if (
                username === savedUser.username &&
                password === savedUser.password
            ) {

                message.style.color = "#16a34a";
                message.textContent = "Login successful!";

                setTimeout(() => {

                    alert(
                        "Welcome to SocialHub, " +
                        savedUser.username +
                        "!"
                    );

                }, 300);

            } else {

                message.style.color = "#ef4444";
                message.textContent =
                    "Invalid username or password.";
            }
        }

    </script>

</body>
</html>
